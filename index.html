*{box-sizing:border-box}
body{margin:0;background:#f4f6f8;font-family:Arial,sans-serif;color:#222}
.app{max-width:520px;min-height:100vh;margin:auto;background:#fff}

.page{padding:16px}
.card{border:1px solid #e1e5e9;border-radius:14px;padding:15px;margin-bottom:13px;box-shadow:0 2px 7px #0001}
h2,h3{margin-top:0}
label{display:block;font-weight:700;margin:12px 0 6px}
input{width:100%;padding:13px;border:1px solid #ccd2d8;border-radius:10px;background:#fff;font-size:16px}

.secondary{background:#6c757d}
.light{background:#eef3f8;color:#222}
.small{width:auto;margin:0;padding:8px 11px;font-size:13px}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.options{display:grid;gap:8px}
.option{width:100%;padding:13px;border:1px solid #d5dbe1;border-radius:10px;background:#fff;text-align:left;font-weight:700}
.muted{font-size:13px;color:#777}

.ok{padding:11px;border-radius:10px;background:#d1e7dd;color:#0f5132;font-size:13px}
.balance{text-align:center;font-size:29px;font-weight:800;padding:18px}
.balance small{display:block;font-size:13px;color:#666;font-weight:400}
.back{border:0;background:none;color:#0d6efd;font-weight:700;padding:0;margin-bottom:12px}
.item{display:flex;justify-content:space-between;gap:10px;align-items:center;border:1px solid #e1e5e9;border-radius:11px;padding:11px;margin-top:8px}
.itemname{font-weight:700;overflow-wrap:anywhere}
.history{border-bottom:1px solid #e5e5e5;padding:12px 0}
.history:last-child{border:0}
.historytop{display:flex;justify-content:space-between;gap:8px}
.in{color:#198754;font-weight:800}
.out{color:#dc3545;font-weight:800}
.empty{text-align:center;color:#777;padding:18px}
.row{display:flex;gap:8px}
.row>*{flex:1}
.footer{text-align:center;color:#888;font-size:12px;padding:20px}
.account{border:1px solid #dce2e8;border-radius:11px;padding:12px;margin-top:9px}
.account.active{border:2px solid #0d6efd;background:#f1f7ff}
.accounttop{display:flex;justify-content:space-between;gap:8px;align-items:center}
.accountname{font-weight:800}
.badge{font-size:11px;background:#0d6efd;color:#fff;padding:4px 7px;border-radius:7px}
@media(max-width:360px){.grid{grid-template-columns:1fr}}

let S={
screen:'loading',
user:null,
accounts:[],
activeId:null,

f2:'',

},

const A=document.getElementById('app');

const e=x=>String(x??'').replace(/[&<>"']/g,m=>({
'&':'&amp;',
'<':'&lt;',
'>':'&gt;',
'"':'&quot;',
"'":'&#039;'
}[m]));

const rup=x=>new Intl.NumberFormat('id-ID',{
style:'currency',
currency:'IDR',
maximumFractionDigits:0
}).format(Number(x)||0);

const dt=x=>new Date(x).toLocaleString('id-ID',{
day:'2-digit',
month:'2-digit',
year:'numeric',
hour:'2-digit',
minute:'2-digit'
});

function active(){
return S.accounts.find(x=>String(x.id)===String(S.activeId))||null;
}

function bal(){
let p=active();
if(!p)return 0;

return (p.tx||[]).reduce((n,t)=>
n+(t.jenis==='pemasukan'?+t.nominal:-+t.nominal),0
);
}

function localKey(){
return 'keuangan_kurir_accounts';
}

function localSave(){
try{
localStorage.setItem(localKey(),JSON.stringify({
accounts:S.accounts,
activeId:S.activeId
}));
}catch(_){}
}

function localLoad(){
try{
let x=JSON.parse(localStorage.getItem(localKey())||'null');

if(x&&Array.isArray(x.accounts)&&x.accounts.length){
S.accounts=x.accounts.map(normalizeAccount);
S.activeId=x.activeId||S.accounts[0].id;
return true;
}

let old=JSON.parse(localStorage.getItem('keuangan_kurir_account')||'null');

if(old?.p){
let p=normalizeAccount({
...old.p,
id:old.p.id||('local-'+crypto.randomUUID()),
tx:old.tx||[],
quick:old.quick||[]
});

S.accounts=[p];
S.activeId=p.id;
localSave();
return true;
}

}catch(_){}

return false;
}

function normalizeAccount(p){
return {
id:p.id||('local-'+crypto.randomUUID()),
owner_id:p.owner_id||null,
nama_kurir:p.nama_kurir||'',
nama_usaha:p.nama_usaha||'',
nomor_whatsapp:p.nomor_whatsapp||'',
alamat_lengkap:p.alamat_lengkap||'',
latitude:p.latitude??null,
longitude:p.longitude??null,
jenis_penghasilan:p.jenis_penghasilan||'',
jenis_usaha:p.jenis_usaha||'',
saldo:Number(p.saldo)||0,
tx:Array.isArray(p.tx)?p.tx:[],
quick:Array.isArray(p.quick)?p.quick:[]
};
}

async function auth(){
try{
let q=await sb.auth.getSession();

if(q.data.session){
S.user=q.data.session.user;
return S.user;
}

let a=await sb.auth.signInAnonymously();

if(a.error)throw a.error;

S.user=a.data.user;
return S.user;

}catch(_){
return null;
}
}

async function cloudLoad(){
if(!S.user)return false;

try{

/*
  Akun lama tetap dibaca dari kurir_profiles.
  Akun tambahan dibaca dari tabel keuangan_accounts
  jika tabel tersebut sudah dibuat.
*/

let old=await sb
.from('kurir_profiles')
.select('*')
.eq('id',S.user.id)
.maybeSingle();

let list=[];

if(old.data){

let oldTx=await sb
.from('kurir_transactions')
.select('*')
.eq('kurir_id',S.user.id)
.order('created_at',{ascending:false});

let quick=JSON.parse(
localStorage.getItem('quick_'+S.user.id)||'[]'
);

list.push(normalizeAccount({
...old.data,
id:old.data.id||S.user.id,
owner_id:S.user.id,
tx:oldTx.data||[],
quick:Array.isArray(quick)?quick:[]
}));

}

try{

let more=await sb
.from('keuangan_accounts')
.select('*')
.eq('owner_id',S.user.id)
.order('created_at',{ascending:true});

if(!more.error&&Array.isArray(more.data)){

for(let p of more.data){

if(list.some(x=>String(x.id)===String(p.id)))continue;

let txq=await sb
.from('keuangan_transactions')
.select('*')
.eq('account_id',p.id)
.order('created_at',{ascending:false});

let qk=JSON.parse(
localStorage.getItem('quick_'+p.id)||'[]'
);

list.push(normalizeAccount({
...p,
tx:txq.data||[],
quick:Array.isArray(qk)?qk:[]
}));

}

}

}catch(_){}

if(list.length){

S.accounts=list;
S.activeId=S.activeId&&list.some(x=>String(x.id)===String(S.activeId))
?S.activeId
:list[0].id;

localSave();

return true;
}

}catch(_){}

return false;
}

if(q.data.session){
S.user=q.data.session.user;
await cloudLoad();
render();
}

}catch(_){}

return;
}

try{

let q=await sb.auth.getSession();

if(q.data.session){

S.user=q.data.session.user;

if(await cloudLoad()){
S.screen='dash';
render();
return;
}

}

}catch(_){}

S.screen='start';
render();
}

else if(S.screen==='hin')history('pemasukan');
else if(S.screen==='hout')history('pengeluaran');
else if(S.screen==='edit')edit();

function locate(){

let z=document.getElementById('ls');

if(!navigator.geolocation){
z.textContent='Browser tidak mendukung lokasi.';
return;
}

z.textContent='Meminta izin lokasi...';

navigator.geolocation.getCurrentPosition(
p=>{
S.loc={
lat:p.coords.latitude,
lng:p.coords.longitude
};

z.textContent='Lokasi berhasil dibagikan.';
},
()=>{
z.textContent=
'Lokasi belum berhasil dibagikan. Izinkan lokasi pada browser lalu coba lagi.';
},
{
enableHighAccuracy:true,
timeout:15000,
maximumAge:0
}
);

}

async function finish(){

let n=document.getElementById('rn').value.trim();
let u=document.getElementById('ru').value.trim();
let t=document.getElementById('rt').value.trim();
let a=document.getElementById('ra').value.trim();

if(!n||!u||!t||!a)
return alert('Lengkapi semua data pendaftaran.');

let user=await auth();

let p=normalizeAccount({
id:crypto.randomUUID(),
owner_id:user?.id||null,
nama_kurir:n,
nama_usaha:u,
nomor_whatsapp:t,
alamat_lengkap:a,
latitude:S.loc.lat,
longitude:S.loc.lng,
jenis_penghasilan:S.reg.cat,
jenis_usaha:S.reg.biz,
saldo:0,
tx:[],
quick:[]
});

S.accounts.push(p);
S.activeId=p.id;

localSave();

await saveAccountCloud(p);

S.screen='dash';
render();

}

async function saveAccountCloud(p){

if(!S.user)return;

try{

/*
  Akun pertama tetap memakai kurir_profiles
  agar kode/database lama tetap dapat digunakan.
*/

if(String(p.id)===String(S.user.id)){

await sb
.from('kurir_profiles')
.upsert({
id:S.user.id,
nama_kurir:p.nama_kurir,
nama_usaha:p.nama_usaha,
nomor_whatsapp:p.nomor_whatsapp,
alamat_lengkap:p.alamat_lengkap,
latitude:p.latitude,
longitude:p.longitude,
jenis_penghasilan:p.jenis_penghasilan,
jenis_usaha:p.jenis_usaha,
saldo:balFor(p),
updated_at:new Date().toISOString()
});

return;
}

/*
  Akun kedua dan seterusnya menggunakan
  tabel keuangan_accounts.
*/

await sb
.from('keuangan_accounts')
.upsert({
id:p.id,
owner_id:S.user.id,
nama_kurir:p.nama_kurir,
nama_usaha:p.nama_usaha,
nomor_whatsapp:p.nomor_whatsapp,
alamat_lengkap:p.alamat_lengkap,
latitude:p.latitude,
longitude:p.longitude,
jenis_penghasilan:p.jenis_penghasilan,
jenis_usaha:p.jenis_usaha,
saldo:balFor(p),
updated_at:new Date().toISOString()
});

}catch(_){}

}

function balFor(p){

return (p.tx||[]).reduce(
(n,t)=>n+(t.jenis==='pemasukan'?+t.nominal:-+t.nominal),
0
);

}

async function addIn(){

let n=document.getElementById('inname').value.trim();
let a=Number(document.getElementById('inamt').value);

if(!n||!a||a<=0)
return alert('Isi pemasukan dan nominal dengan benar.');

await addTx('pemasukan',n,a);

alert('Pemasukan berhasil dicatat.');
render();

}

function addQuick(){

let p=active();

if(!p)return;

let n=document.getElementById('qn').value.trim();
let a=Number(document.getElementById('qa').value);

if(!n||!a||a<=0)
return alert('Isi nama dan harga dengan benar.');

p.quick.push({
id:crypto.randomUUID(),
name:n,
amount:a
});

localSave();

localStorage.setItem(
'quick_'+p.id,
JSON.stringify(p.quick)
);

render();

}

async function quickRecord(i){

let p=active();
let x=p?.quick[i];

if(!x)return;

await addTx('pemasukan',x.name,x.amount);

alert('Pemasukan berhasil dicatat.');
render();

}

function quickDelete(i){

let p=active();

if(!p)return;

if(confirm('Hapus pemasukan tersimpan ini?')){

p.quick.splice(i,1);

localStorage.setItem(
'quick_'+p.id,
JSON.stringify(p.quick)
);

localSave();
render();

}

}

async function addOut(){

let a=Number(document.getElementById('oamt').value);

if(!n||!a||a<=0)
return alert('Isi belanjaan dan nominal dengan benar.');

alert('Pengeluaran berhasil dicatat.');
render();

async function addTx(j,n,a){

let p=active();

if(!p)return;

let t={
id:crypto.randomUUID(),
account_id:p.id,
jenis:j,
keterangan:n,
nominal:+a,
created_at:new Date().toISOString()
};

p.tx.unshift(t);

p.saldo=balFor(p);

localSave();

await insertTx(t);

await saveAccountCloud(p);

}

async function insertTx(t){

let p=active();

if(!p||!S.user)return;

try{

/*
  Akun lama memakai tabel lama.
  Akun tambahan memakai tabel baru.
*/

if(String(p.id)===String(S.user.id)){

let q=await sb
.from('kurir_transactions')
.insert({
kurir_id:S.user.id,
jenis:t.jenis,
keterangan:t.keterangan,
nominal:t.nominal,
created_at:t.created_at
});

if(q.error){

return;
}

}else{

await sb
.from('keuangan_transactions')
.insert({
id:t.id,
account_id:p.id,
owner_id:S.user.id,
jenis:t.jenis,
keterangan:t.keterangan,
nominal:t.nominal,
created_at:t.created_at
});

}

}catch(_){}

}

}

async function delTx(id){

let p=active();

if(!p)return;

let t=p.tx.find(
x=>String(x.id)===String(id)
);

if(!t)return;

if(!confirm(
'Hapus transaksi ini? Saldo akan disesuaikan.'
))return;

if(S.user){

try{

if(String(p.id)===String(S.user.id)){

if(!String(t.id).startsWith('local-')){

let q=await sb
.from('kurir_transactions')
.delete()
.eq('id',t.id)
.eq('kurir_id',S.user.id);

if(q.error)
return alert(
'Transaksi belum dapat dihapus dari database.'
);

}

}else{

let q=await sb
.from('keuangan_transactions')
.delete()
.eq('id',t.id)
.eq('account_id',p.id);

if(q.error)
return alert(
'Transaksi belum dapat dihapus dari database.'
);

}

}catch(_){}

}

p.tx=p.tx.filter(
x=>String(x.id)!==String(id)
);

p.saldo=balFor(p);

localSave();

await saveAccountCloud(p);

render();

}

function switchAccount(id){

x=>String(x.id)===String(id)
);

if(!p)return;

S.activeId=p.id;

localSave();

S.screen='dash';
render();

}

async function saveEdit(){

let n=document.getElementById('en').value.trim();
let u=document.getElementById('eu').value.trim();
let t=document.getElementById('et').value.trim();

nama_usaha:u,

});
