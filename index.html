/* PENYEMPURNAAN TAMPILAN — tanpa mengubah fungsi tombol yang sudah ada */
:root{--brand:#1266e8;--brand-dark:#0847ad;--ink:#172338;--muted:#69778b;--line:#e4eaf2;--surface:#ffffff;--canvas:#f3f6fb}
body{background:linear-gradient(180deg,#eaf2ff 0,#f4f7fb 250px,#f4f7fb 100%);color:var(--ink);font-family:Arial,Helvetica,sans-serif;line-height:1.45}
.app{max-width:560px;background:transparent;min-height:100vh;box-shadow:0 0 36px #163b700b}
.header{background:linear-gradient(135deg,#0b55cf 0%,#1479ff 55%,#45a1ff 100%);padding:24px 18px 25px;position:relative;overflow:hidden;box-shadow:0 5px 18px #0755c51c}
.header:before{content:"";position:absolute;width:190px;height:190px;border-radius:50%;background:#ffffff12;right:-55px;top:-85px}
.header:after{content:"";position:absolute;width:110px;height:110px;border-radius:50%;background:#ffffff0d;left:-35px;bottom:-70px}
.header h1{position:relative;font-size:clamp(21px,5vw,27px);letter-spacing:.25px;font-weight:800;margin:0 0 7px;text-shadow:0 1px 2px #003d9b2b}
.header p{position:relative;font-size:14px;line-height:1.45;color:#eff6ff;max-width:330px;margin:0 auto}
.page{padding:15px 12px 24px;min-height:55vh}
.card{background:var(--surface);border:1px solid var(--line);border-radius:17px;padding:15px;margin-bottom:12px;box-shadow:0 5px 18px #17365d0a}
h2{font-size:18px;line-height:1.3;color:#172b49;margin:0 0 11px;font-weight:800}
h3{font-size:16px;line-height:1.3;color:#172b49;margin:0 0 8px;font-weight:800}
label{font-size:13px;color:#34445c;margin:12px 0 5px}
input{border:1px solid #d5deea;border-radius:11px;padding:12px;background:#fbfdff;color:#172338;outline:none;transition:border-color .15s,box-shadow .15s}
input:focus{border-color:#4389f5;box-shadow:0 0 0 3px #1677ff18;background:#fff}
.btn{border-radius:11px;padding:12px 11px;font-size:13px;letter-spacing:.15px;box-shadow:0 3px 8px #0d6efd12;cursor:pointer}
.btn.success{background:linear-gradient(135deg,#168653,#21a36a)}.btn.danger{background:linear-gradient(135deg,#d92d42,#ed5261)}.btn.secondary{background:linear-gradient(135deg,#52647b,#718198)}.btn.light{background:#edf4ff;color:#1556ac;border:1px solid #dce9ff;box-shadow:none}
.grid{gap:8px}.grid .btn{min-height:48px;line-height:1.25}
.options{gap:7px}.option{border:1px solid #e0e7f0;border-radius:12px;background:linear-gradient(180deg,#fff,#fbfdff);padding:12px;color:#233954;box-shadow:0 2px 6px #1d3c6308;line-height:1.35;cursor:pointer}
.option:hover{border-color:#a9c9fb;background:#f6faff}
.muted{color:var(--muted);font-size:13px;line-height:1.45}
.notice{border:1px solid #ffe3a1;border-radius:12px;background:#fff8e7;color:#805400;line-height:1.45}
.ok{border:1px solid #bde7d0;border-radius:12px;line-height:1.5}
.balance{border:0;border-radius:18px;background:linear-gradient(135deg,#0c4fc2,#1479ff 68%,#42a2ff);color:#fff;box-shadow:0 8px 20px #0d6efd25;padding:20px 14px;font-size:clamp(25px,6vw,32px);overflow-wrap:anywhere}
.balance small{color:#e4efff;font-size:12px;letter-spacing:1px;margin-bottom:5px}
.back{display:inline-flex;align-items:center;padding:7px 2px;margin:0 0 8px;color:#145fc9;font-size:14px;cursor:pointer}
.headerline{padding-bottom:11px;margin-bottom:10px;border-bottom:1px solid #edf1f6}
.headerline .btn{box-shadow:none}
.quick-item{border-color:#e1e8f1;border-radius:11px;padding:8px;background:#fbfdff;min-height:54px}
.quick-menu-btn{border:1px solid #dce6f4;background:#eef5ff;color:#135bc3;border-radius:10px}
.quick-menu{border-color:#e0e7f0;box-shadow:0 9px 24px #102b4a1c}
.quick-menu button{padding:11px;color:#243851}
.history{padding:12px 0;border-color:#e8edf4}
.historytop{align-items:flex-start}
.itemname{color:#263a55;line-height:1.35}
.empty{border:1px dashed #d6e0ed;border-radius:12px;background:#f8fbff;color:#738197}
.footer{padding:22px 12px;color:#8491a4;font-size:12px}
/* Halaman awal tetap memakai tombol JENIS USAHA yang sama. */
.start-hero{border:0;background:linear-gradient(145deg,#fff,#f4f8ff);padding:19px 16px;overflow:hidden;position:relative}
.start-mark{width:54px;height:54px;border-radius:16px;background:linear-gradient(135deg,#0d61e8,#48a2ff);display:flex;align-items:center;justify-content:center;color:#fff;font-size:28px;box-shadow:0 7px 15px #0d6efd30;margin-bottom:13px}
.start-copy{font-size:14px;color:#617188;margin:0 0 15px;line-height:1.55}
.start-note{display:flex;gap:10px;align-items:flex-start;padding:11px;border-radius:12px;background:#f0f6ff;border:1px solid #e1edff;margin:12px 0;color:#395574;font-size:12px;line-height:1.45}
.start-note strong{display:block;color:#1e4f93;margin-bottom:2px}
@media(min-width:430px){.page{padding:18px 16px 28px}.card{padding:17px;margin-bottom:14px}.header{padding:27px 20px 28px}}
@media(max-width:360px){.header{padding:20px 12px}.page{padding:11px 9px 20px}.card{padding:12px;border-radius:14px}.btn{font-size:12px;padding:11px 8px}}


/* MODE SIMPEL: tombol utama sejajar di bagian paling atas dashboard */
body{background:#edf5ff!important;color:#17304f!important;line-height:1.4}
.app{max-width:560px!important;background:#f7fbff!important;box-shadow:none!important}
.header{background:linear-gradient(135deg,#0756b5,#1685e8)!important;box-shadow:none!important;padding:17px 12px!important}

.btn{box-shadow:none!important;border-radius:8px!important;background:#1266d6!important;border-color:#1266d6!important;color:#fff!important}
.option{box-shadow:none!important;background:#f2f7ff!important;border:1px solid #cfe0f8!important;border-radius:8px!important}

.main-nav{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:5px;margin:0 0 10px;position:relative}
.nav-tile{min-width:0;min-height:70px;border:1px solid #cfe0f8;border-radius:9px;background:#f7fbff;padding:7px 2px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:5px;color:#24344a;font-family:Arial,sans-serif;font-weight:700;font-size:clamp(10px,2.9vw,12px);line-height:1.15;cursor:pointer;white-space:normal;overflow-wrap:anywhere}
.nav-icon{display:flex;align-items:center;justify-content:center;width:27px;height:27px;border-radius:7px;font-size:20px;font-weight:800;line-height:1}
.nav-income .nav-icon{background:#d8eaff;color:#0756b5}.nav-expense .nav-icon{background:#e2efff;color:#155db0}.nav-debt .nav-icon{background:#dcecff;color:#0756b5;font-size:13px}.nav-history .nav-icon{background:#d8eaff;color:#0756b5;font-size:19px}
.nav-tile:active{transform:scale(.98)}
.simple-account{margin-bottom:9px!important}
.simple-label{font-size:11px;font-weight:700;color:#64748b;margin-bottom:4px;letter-spacing:.4px}
.simple-account b{font-size:16px;display:block;margin-bottom:3px;overflow-wrap:anywhere}.simple-account .business-name{font-size:19px;font-weight:800;color:#172033;margin:2px 0 4px}
.simple-tools h3{font-size:14px;margin:0 0 8px!important}
.simple-tool-row{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:5px}
.simple-tool-row .btn{margin:0!important;padding:10px 4px!important;font-size:11px!important;min-height:42px}
.footer{padding:12px!important}
@media(max-width:340px){.nav-tile{font-size:10px;min-height:65px}.nav-icon{width:24px;height:24px}.simple-tool-row .btn{font-size:10px!important}}

/* Formulir pemasukan, pengeluaran, dan hutang dibuat lebih rapat. */
.compact-form{padding:10px;margin-bottom:8px}
.compact-form h2,.compact-form h3{margin-bottom:6px}
.compact-form label{margin:5px 0 2px;line-height:1.25}
.compact-form input{padding:8px 10px;min-height:38px}
.compact-form .btn{padding:9px 10px;margin-top:4px;min-height:38px}
.compact-form .notice{padding:7px 9px;margin-bottom:5px}
.compact-form .muted{margin:4px 0 6px}

/* Form hutang dua jenis, daftar ringkas, dan aksi langsung tanpa popup. */
.debt-type-switch{display:grid;grid-template-columns:1fr 1fr;gap:6px;margin:8px 0 10px}
.debt-type-btn{border:1px solid #d5dce6;border-radius:9px;background:#f7f9fc;color:#334155;padding:10px 5px;font-weight:700;font-size:13px}

.debt-item{display:flex;align-items:center;justify-content:space-between;gap:9px;padding:10px 0;border-bottom:1px solid #e6eaf0}
.debt-item:last-child{border-bottom:0}

.debt-actions{display:flex;flex-direction:column;gap:5px;flex-shrink:0}
.debt-actions .btn{margin:0;min-width:66px}



/* Penyederhanaan formulir: jarak antarpertanyaan dibuat lebih rapat tanpa mengubah fitur. */

      ...S.accounts[S.current],
      p:S.p,
      tx:S.tx,

  S.p=a.p;

function localLoad(){
  try{
    let all=JSON.parse(
      localStorage.getItem(
        'keuangan_pengusaha_accounts'
      )||'null'
    );

    if(Array.isArray(all)&&all.length){
      S.accounts=all;

      let last=localStorage.getItem(
        'keuangan_pengusaha_last_account'
      );

      let idx=all.findIndex(
        x=>String(x.p?.id)===String(last)
      );

      loadCurrent(idx>=0?idx:0);

      return true;
    }
  }catch(_){}

  return false;
}

async function getAuthUser(){
  if(!sb)return null;

  try{
    let q=await sb.auth.getSession();

    if(q.data?.session)
      return q.data.session.user;

    let a=await sb.auth.signInAnonymously();

    if(a.error)
      throw a.error;

    return a.data.user;
  }catch(_){
    return null;
  }
}

async function cloudLoad(user){
  if(!sb||!user)return false;

  try{
    let q=await sb
      .from('keuangan_accounts')
      .select('*')
      .eq('owner_id',user.id)
      .order('created_at',{ascending:true});

    if(q.error)return false;

    let accounts=q.data||[];
    let out=[];

    for(const a of accounts){

      let [t,r]=await Promise.all([

        sb
          .from('keuangan_transactions')
          .select('*')
          .eq('account_id',a.id)
          .order('created_at',{ascending:false}),

        sb
          .from('keuangan_quick_items')
          .select('*')
          .eq('account_id',a.id)
          .order('created_at',{ascending:true})

      ]);

      if(t.error||r.error)
        return false;

      out.push({
        p:{
          id:a.id,
          nama_kurir:a.nama,
          nama_usaha:a.nama_usaha,
          nomor_whatsapp:a.nomor_telepon,
          alamat_lengkap:a.alamat_lengkap,
          latitude:a.latitude,
          longitude:a.longitude,
          jenis_penghasilan:a.jenis_penghasilan,
          jenis_usaha:a.jenis_usaha,
          saldo_awal:Number(a.saldo_awal||0),
          saldo:Number(a.saldo||0)
        },

        tx:(t.data||[]).map(x=>({
          id:x.id,
          jenis:x.jenis,
          keterangan:x.keterangan,
          nominal:Number(x.nominal),
          created_at:x.created_at
        })),

        quick:(r.data||[]).map(x=>({
          id:x.id,
          name:x.name,
          amount:Number(x.amount)
        }))
      });
    }

    /*
      Gabungkan akun dari Supabase dengan akun lokal.
      Sebelumnya daftar lokal langsung ditimpa hasil cloud,
      sehingga akun yang belum tersimpan/terbaca dari cloud
      bisa hilang dari daftar yang ditampilkan.
    */
    const localAccounts=Array.isArray(S.accounts)?S.accounts:[];
    const merged=[...out];
    const cloudIds=new Set(out.map(x=>String(x.p?.id)));

    for(const local of localAccounts){
      const id=String(local.p?.id ?? '');
      if(!id || !cloudIds.has(id)){
        merged.push(local);
      }
    }

    if(merged.length){
      S.accounts=merged;

      let last=localStorage.getItem(
        'keuangan_pengusaha_last_account'
      );

      let idx=merged.findIndex(
        x=>String(x.p?.id)===String(last)
      );

      if(idx<0 && S.p){
        idx=merged.findIndex(
          x=>String(x.p?.id)===String(S.p.id)
        );
      }

      loadCurrent(idx>=0?idx:merged.length-1);
      localSave();
      return true;
    }

  }catch(_){}

  return false;
}

  }catch(_){

}

/* =========================================================
   PERBAIKAN HALAMAN KOSONG
   ========================================================= */

async function init(){

  // Tampilkan aplikasi terlebih dahulu agar kegagalan/lambatnya API
  // tidak membuat halaman kosong.
  const hasLocal=localLoad();

  if(hasLocal){
    S.screen='dash';
    render();
  }else{
    S.screen='start';
    render();
  }

  // Supabase dijalankan di belakang layar.
  // Jika gagal atau lambat, tampilan aplikasi tetap berjalan.
  try{

    const authPromise=getAuthUser();

    const timeout=new Promise(
      resolve=>setTimeout(
        ()=>resolve(null),
        8000
      )
    );

    S.user=await Promise.race([
      authPromise,
      timeout
    ]);

    if(S.user){

      const loadPromise=cloudLoad(S.user);

      const loadTimeout=new Promise(
        resolve=>setTimeout(
          ()=>resolve(false),
          8000
        )
      );

      const loaded=await Promise.race([
        loadPromise,
        loadTimeout
      ]);

      if(loaded){
        S.screen='dash';
        render();
      }
    }

  }catch(_){

    // Jangan biarkan gangguan API menghentikan aplikasi.
  }
}

function render(){

  A=ROOT;

  /* Pada halaman keuangan, informasi usaha dan menu utama tetap terlihat.
     Yang berubah hanya area konten di bawah empat tombol. */
  const keepMainMenu=[
    'dash','in','out','hdebt','hall','hin','hout','hdetail','hmenu','profit'

  if(keepMainMenu.includes(S.screen)){

async function finish(){

  let n=document.getElementById('rn').value.trim();
  let u=document.getElementById('ru').value.trim();
  let t=document.getElementById('rt').value.trim();
  let a=document.getElementById('ra').value.trim();

  if(!n||!u||!t||!a) return;


  if(S.changing){

    let old=S.p;
    let oldTx=S.tx;
    let oldQuick=S.quick;
    let oldSaldo=bal();

    S.p={
      ...old,
      nama_kurir:n,
      nama_usaha:u,
      nomor_whatsapp:t,
      alamat_lengkap:a,
      latitude:S.loc.lat??old.latitude,
      longitude:S.loc.lng??old.longitude,
      jenis_penghasilan:S.reg.cat,
      jenis_usaha:S.reg.biz
    };

    let net=oldTx.reduce(
      (z,x)=>
        z+
        (
          x.jenis==='pemasukan'
          ?Number(x.nominal)
          :(x.jenis==='pengeluaran'?-Number(x.nominal):0)
        ),
      0
    );

    S.p.saldo_awal=
      oldSaldo-net;

    S.p.saldo=
      oldSaldo;

    S.accounts[S.current]={
      p:S.p,
      tx:oldTx,
      quick:oldQuick
    };

    localSave();

    await cloudAccountUpsert();

    S.changing=false;
    S.screen='dash';

    render();

    return;
  }


  let id=
    'local-'+crypto.randomUUID();

  let p={
    id,
    nama_kurir:n,
    nama_usaha:u,
    nomor_whatsapp:t,
    alamat_lengkap:a,
    latitude:S.loc.lat,
    longitude:S.loc.lng,
    jenis_penghasilan:S.reg.cat,
    jenis_usaha:S.reg.biz,
    saldo_awal:0,
    saldo:0
  };

  if(!S.user)
    S.user=await getAuthUser();

  S.accounts.push({
    p,
    tx:[],
    quick:[],
    profit:{materials:[],goods:[],formType:'material',result:false,salePrice:''}
  });

  loadCurrent(
    S.accounts.length-1
  );

  localSave();


  if(S.user&&sb){

    let realId=
      crypto.randomUUID();

    p.id=realId;

    S.accounts[S.current].p=p;
    S.p=p;

    localSave();

    await cloudAccountUpsert();
  }

  S.adding=false;
  S.screen='dash';

  render();
}

function ensureProfit(){
  if(!S.profit || typeof S.profit!=='object') S.profit={};
  if(!Array.isArray(S.profit.materials)) S.profit.materials=[];
  if(!Array.isArray(S.profit.goods)) S.profit.goods=[];
  if(!S.profit.formType) S.profit.formType='material';
  if(typeof S.profit.result!=='boolean') S.profit.result=false;
  if(S.profit.salePrice===undefined) S.profit.salePrice='';
}

  ensureProfit();

}
const PROFIT_UNITS={
  gram:{label:'Gram (g)',group:'weight',factor:1},
  kg:{label:'Kilogram (kg)',group:'weight',factor:1000},
  mg:{label:'Miligram (mg)',group:'weight',factor:0.001},
  ml:{label:'Mililiter (ml)',group:'volume',factor:1},
  liter:{label:'Liter (L)',group:'volume',factor:1000},
  pcs:{label:'Pcs / buah',group:'unit',factor:1},
  cup:{label:'Cup / gelas',group:'unit',factor:1},
  bungkus:{label:'Bungkus',group:'unit',factor:1},
  botol:{label:'Botol',group:'unit',factor:1},
  sachet:{label:'Sachet',group:'unit',factor:1},
  lembar:{label:'Lembar',group:'unit',factor:1},
  meter:{label:'Meter (m)',group:'length',factor:1},
  cm:{label:'Sentimeter (cm)',group:'length',factor:0.01}
};
function qtyNumber(value){
  if(typeof value==='number') return Number.isFinite(value)?value:0;
  const match=String(value||'').trim().match(/[0-9][0-9.,]*/);
  if(!match) return 0;
  let raw=match[0];
  if(raw.includes('.') && raw.includes(',')){raw=raw.replace(/\./g,'').replace(',','.');}
  else if(raw.includes('.')){raw=raw.replace(/\./g,'');}
  else if(raw.includes(',')){raw=raw.replace(',','.');}
  const n=Number(raw);
  return Number.isFinite(n)?n:0;
}
function itemQuantity(item,which){
  const raw=which==='purchase'?item.purchaseQty:item.usage;
  const unit=which==='purchase'?(item.purchaseUnit||'gram'):(item.usageUnit||'gram');
  const n=qtyNumber(raw);
  const from=PROFIT_UNITS[unit];
  if(!from) return n;
  // Konversi otomatis hanya untuk satuan yang sejenis.
  const otherUnit=which==='purchase'?(item.usageUnit||'gram'):(item.purchaseUnit||'gram');
  const other=PROFIT_UNITS[otherUnit];
  if(!other||from.group!==other.group) return n;
  return n*from.factor;
}
function profitCost(item){
  // Bahan dan barang dihitung berdasarkan jumlah pembelian serta pemakaian per penjualan.
  const purchased=itemQuantity(item,'purchase');
  const used=itemQuantity(item,'usage');
  const pu=PROFIT_UNITS[item.purchaseUnit||'gram'];
  const uu=PROFIT_UNITS[item.usageUnit||'gram'];
  if(!purchased||!used||!pu||!uu||pu.group!==uu.group) return 0;
  return Number(item.totalPrice||0)*used/purchased;
}
function profitUnitOptions(selected){
  return Object.entries(PROFIT_UNITS).map(([key,u])=>`<option value="${key}" ${key===selected?'selected':''}>${u.label}</option>`).join('');
}
function profitUnitPicker(id,selected='gram'){
  const unit=PROFIT_UNITS[selected]||PROFIT_UNITS.gram;
  return `<div class="unit-picker">
    <input type="hidden" id="${id}" value="${selected}">
    <button type="button" class="unit-picker-btn" onclick="toggleProfitUnitMenu('${id}')"><span id="${id}Label">${unit.label}</span><span>▾</span></button>
    <div class="unit-picker-menu" id="${id}Menu">${Object.entries(PROFIT_UNITS).map(([key,u])=>`<button type="button" class="unit-picker-option" onclick="chooseProfitUnit('${id}','${key}')">${u.label}</button>`).join('')}</div>
  </div>`;
}
function toggleProfitUnitMenu(id){
  const menu=document.getElementById(id+'Menu');
  if(!menu)return;
  document.querySelectorAll('.unit-picker-menu.open').forEach(x=>{if(x!==menu)x.classList.remove('open')});
  menu.classList.toggle('open');
}
function chooseProfitUnit(id,key){
  const input=document.getElementById(id);
  const label=document.getElementById(id+'Label');
  const menu=document.getElementById(id+'Menu');
  if(input&&PROFIT_UNITS[key])input.value=key;
  if(label&&PROFIT_UNITS[key])label.textContent=PROFIT_UNITS[key].label;
  if(menu)menu.classList.remove('open');
}
function profitAll(){
  ensureProfit();
  return [...S.profit.materials,...S.profit.goods];
}
function profitSum(){
  return profitAll().reduce((sum,item)=>sum+profitCost(item),0);
}

async function quickRecord(i){

async function quickDelete(i){

  let oldY=window.scrollY;
  S.quick.splice(i,1);S.quickMenu=-1;S.quickEditing=-1;

}

async function saveDebt(){

async function markDebtPaid(id){
  const t=(S.tx||[]).find(x=>String(x.id)===String(id)&&x.jenis==='hutang');

  t.status='lunas';t.lunas_at=new Date().toISOString();

async function deleteDebt(id){
  const t=(S.tx||[]).find(x=>String(x.id)===String(id)&&x.jenis==='hutang');
  if(!t)return;
  if(sb&&S.user&&S.p&&!String(S.p.id).startsWith('local-')){
    try{await sb.from('keuangan_transactions').delete().eq('id',id).eq('account_id',S.p.id);}catch(_){}
  }
  S.tx=S.tx.filter(x=>String(x.id)!==String(id));
  localSave();S.screen='hdebt';render();
}

function historyDetail(){
  let type=S.historyType,key=S.historyDate;
  let all=S.tx.filter(t=>dateKey(t.created_at)===key);
  let arr=all.filter(t=>type==='semua'||t.jenis===type);
  let label=all[0]?dateLabel(all[0].created_at):dateLabel(key+'T12:00:00');
  let title=type==='semua'?'RIWAYAT KESELURUHAN':type==='pemasukan'?'RIWAYAT PEMASUKAN':type==='pengeluaran'?'RIWAYAT PENGELUARAN':'RIWAYAT HUTANG';

  const makeList=(items)=>items.map(t=>{
    let cls=t.jenis==='pemasukan'?'in':t.jenis==='pengeluaran'?'out':'muted';
    let sign=t.jenis==='pemasukan'?'+':t.jenis==='pengeluaran'?'-':'HUTANG · ';
    const debtStatus=t.jenis==='hutang'?(t.status==='lunas'?' · ✓ LUNAS':' · BELUM LUNAS'):'';
    const debtDetails=t.jenis==='hutang'?`<div class="muted">${t.debtType==='saya'?'Hutang Saya':'Hutang Orang Lain'} · Keperluan: ${e(t.keperluan||'-')}</div>`:'';
    return `<div class="history"><div class="historytop"><div class="itemname">${e(t.namaPihak||t.keterangan)}<div class="muted">${new Date(t.created_at).toLocaleTimeString('id-ID',{hour:'2-digit',minute:'2-digit'})} · ${t.jenis.toUpperCase()}${debtStatus}</div>${debtDetails}</div><div class="${cls}">${sign}${rup(t.nominal)}</div></div><button class="btn small danger" onclick="delTx('${e(t.id)}')">HAPUS</button></div>`;
  }).join('');

  if(type==='semua'){
    const incomes=all.filter(t=>t.jenis==='pemasukan');
    const expenses=all.filter(t=>t.jenis==='pengeluaran');
    const paidDebts=all.filter(t=>t.jenis==='hutang'&&t.status==='lunas');
    const sum=items=>items.reduce((n,t)=>n+Number(t.nominal||0),0);
    const section=(heading,subheading,items,totalLabel)=>`<section class="history-summary-section"><h3>${heading}</h3><h4>${subheading}</h4>${makeList(items)||'<div class="empty">Belum ada catatan.</div>'}<div class="balance" style="padding:10px 0"><small>${totalLabel}</small>${rup(sum(items))}</div></section>`;
    A.innerHTML=`<main class="page"><button class="back" onclick="S.screen='hmenu';render()">← Pilih Jenis Riwayat</button><div class="card"><h2>${title}</h2><div class="notice">${label}</div>${section('PEMASUKAN','Semua Pemasukan',incomes,'Total Pemasukan')}${section('PENGELUARAN','Semua Pengeluaran',expenses,'Total Pengeluaran')}${section('HUTANG YANG LUNAS','Semua Hutang yang Lunas',paidDebts,'Total Hutang yang Lunas')}</div></main>`;
    return;
  }

  let total=arr.reduce((n,t)=>n+Number(t.nominal),0);
  let list=makeList(arr);
  A.innerHTML=`<main class="page"><button class="back" onclick="S.screen='hmenu';render()">← Pilih Jenis Riwayat</button><div class="card"><h2>${title}</h2><div class="notice">${label}</div>${list||'<div class="empty">Belum ada catatan untuk kategori ini pada tanggal tersebut.</div>'}<div class="balance" style="padding:10px 0"><small>Total nominal tercatat</small>${rup(total)}</div></div></main>`;
}

async function delTx(id){

  let t=
    S.tx.find(
      x=>String(x.id)===String(id)
    );

  if(!t) return;
  if(!(await cloudTxDelete(t.id))) return;

  S.tx=
    S.tx.filter(
      x=>String(x.id)!==String(id)
    );

  S.p.saldo=bal();

  localSave();

  await cloudAccountUpsert();

  render();
}

function switchAccount(i){

  if(
    i<0||

  )
    return;

  loadCurrent(i);

  localSave();

  S.screen='dash';

  render();
}

// Hapus akun yang dipilih dari daftar lokal dan, bila tersedia,
// hapus data terkait di cloud. Tidak memakai popup konfirmasi.
async function deleteAccount(i){
  if(i<0 || i>=S.accounts.length) return;

  syncCurrent();
  const account=S.accounts[i];
  if(!account || !account.p) return;
  const id=account.p.id;
  const wasCurrent=String(S.p?.id)===String(id);

  S.accounts.splice(i,1);
  // Indeks aktif berubah setelah penghapusan; cegah data akun lama
  // tertulis ke posisi akun lain saat memuat akun pengganti.
  S.current=-1;

  if(S.accounts.length){
    let next=wasCurrent?Math.min(i,S.accounts.length-1):S.accounts.findIndex(a=>String(a.p?.id)===String(S.p?.id));
    if(next<0) next=0;
    loadCurrent(next);
  }else{
    S.current=-1;
    S.p=null;
    S.tx=[];
    S.quick=[];
    S.profit={materials:[],goods:[],formType:'material',result:false,salePrice:''};
    try{localStorage.removeItem('keuangan_pengusaha_last_account')}catch(_){}
  }

  localSave();
  render();

  if(sb && S.user && id && !String(id).startsWith('local-')){
    try{
      await sb.from('keuangan_transactions').delete().eq('account_id',id).eq('owner_id',S.user.id);
      await sb.from('keuangan_quick_items').delete().eq('account_id',id).eq('owner_id',S.user.id);
      await sb.from('keuangan_accounts').delete().eq('id',id).eq('owner_id',S.user.id);
    }catch(_){}
  }
}

  A.innerHTML=`

  ${e(S.p.jenis_usaha)}

  </div>


  <button
    class="btn light"
    onclick="changeBusiness()">
    UBAH JENIS PENGHASILAN / JENIS USAHA
  </button>


  <button
    class="btn success"
    onclick="saveEdit()">
    SIMPAN PERUBAHAN
  </button>

  </div>

  </main>`;
}


async function saveEdit(){

  let n=
    document.getElementById('en')
    .value.trim();

  let u=
    document.getElementById('eu')
    .value.trim();

  let t=
    document.getElementById('et')
    .value.trim();

  let a=
    document.getElementById('ea')
    .value.trim();

  let ns=
    Number(
      document.getElementById('esaldo')
      .value
    );


  if(!n||!u||!t||!a||Number.isNaN(ns)||ns<0) return;


  let net=
    S.tx.reduce(
      (z,x)=>
        z+
        (
          x.jenis==='pemasukan'
          ?Number(x.nominal)
          :(x.jenis==='pengeluaran'?-Number(x.nominal):0)
        ),
      0
    );


  Object.assign(
    S.p,
    {
      nama_kurir:n,
      nama_usaha:u,
      nomor_whatsapp:t,
      alamat_lengkap:a,
      saldo_awal:ns-net,
      saldo:ns
    }
  );


  localSave();

  await cloudAccountUpsert();


  S.screen='dash';

  render();
}

/* =========================================================
   PERBAIKAN STARTUP
   =========================================================

   Bagian ini menggantikan:

   window.addEventListener('load',init);

   supaya aplikasi tidak bergantung pada event load.
   ========================================================= */

try{

  if(document.readyState==='loading'){

    document.addEventListener(
      'DOMContentLoaded',
      ()=>{
        try{
          init();
        }catch(_){
          S.screen='start';
          render();
        }
      },
      {once:true}
    );

  }else{

    init();

  }

}catch(_){

  try{
    S.screen='start';
    render();
  }catch(__){}

}

</script>
