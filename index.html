/* =========================================================
   SALDO
========================================================= */

function bal(){

let dasar=Number(S.p?.saldo_awal||0);

return dasar+
S.tx.reduce(
(n,t)=>
n+(t.jenis==='pemasukan'?+t.nominal:-+t.nominal),
0
);

}


/* =========================================================
   MULTI AKUN
========================================================= */

function syncCurrent(){

if(S.accounts.length){

S.accounts[S.current]={
p:S.p,
tx:S.tx,
quick:S.quick
};

}

}


function loadCurrent(i){

syncCurrent();

S.current=i;

let a=S.accounts[i];

S.p=a.p;

S.tx=a.tx||[];

S.quick=a.quick||[];

}


function localSave(){

syncCurrent();

if(S.accounts.length){

localStorage.setItem(
'keuangan_kurir_accounts',
JSON.stringify(S.accounts)
);

}else if(S.p){

localStorage.setItem(
'keuangan_kurir_account',
JSON.stringify({
p:S.p,
tx:S.tx,
quick:S.quick
})
);

}

}


function localLoad(){

try{

let all=JSON.parse(
localStorage.getItem('keuangan_kurir_accounts')||'null'
);

if(Array.isArray(all)&&all.length){

S.accounts=all;

loadCurrent(0);

return true;

}


let x=JSON.parse(
localStorage.getItem('keuangan_kurir_account')||'null'
);

if(x?.p){

x.p.saldo_awal=Number(
x.p.saldo_awal||x.p.saldo||0
);

S.accounts=[
{
p:x.p,
tx:x.tx||[],
quick:x.quick||[]
}
];

loadCurrent(0);

localSave();

return true;

}

}catch(_){}

return false;

}


/* =========================================================
   SUPABASE
========================================================= */

async function cloudProfile(){

if(!S.user||!sb)return false;

try{

let q=await sb
.from('kurir_profiles')
.select('*')
.eq('id',S.user.id)
.maybeSingle();

if(q.error||!q.data)return false;

let p=q.data;

p.saldo_awal=Number(
p.saldo_awal??p.saldo??0
);

let t=await sb
.from('kurir_transactions')
.select('*')
.eq('kurir_id',S.user.id)
.order('created_at',{ascending:false});

let tx=t.data||[];

let z=JSON.parse(
localStorage.getItem('quick_'+S.user.id)||'[]'
);

let quick=Array.isArray(z)?z:[];

S.accounts=[
{
p,
tx,
quick
}
];

loadCurrent(0);

localSave();

return true;

}catch(_){

return false;

}

}


async function auth(){

try{

if(!sb)return null;

let q=await sb.auth.getSession();

if(q.data.session){

S.user=q.data.session.user;

return S.user;

}

let a=await sb.auth.signInAnonymously();

if(a.error)throw a.error;

S.user=a.data.user;

return S.user;

}catch(_){

return null;

}

}


async function saveProfile(){

if(
!S.user||
!sb||
S.p?.id!==S.user.id
)return;

try{

await sb
.from('kurir_profiles')
.upsert({

id:S.user.id,
nama_kurir:S.p.nama_kurir,
nama_usaha:S.p.nama_usaha,
nomor_whatsapp:S.p.nomor_whatsapp,
alamat_lengkap:S.p.alamat_lengkap,
latitude:S.p.latitude,
longitude:S.p.longitude,
jenis_penghasilan:S.p.jenis_penghasilan,
jenis_usaha:S.p.jenis_usaha,
saldo_awal:Number(S.p.saldo_awal||0),
saldo:bal(),
updated_at:new Date().toISOString()

});

}catch(_){}

}


async function insertTx(t){

if(!S.user||!sb)return;

try{

let q=await sb
.from('kurir_transactions')
.insert({

kurir_id:S.user.id,
jenis:t.jenis,
keterangan:t.keterangan,
nominal:t.nominal,
created_at:t.created_at

})
.select()
.single();

if(!q.error&&q.data)t.id=q.data.id;

}catch(_){}

}

   INIT
========================================================= */

async function init(){

if(localLoad()){

S.screen='dash';

render();

try{

if(!sb)return;

let q=await sb.auth.getSession();

if(q.data.session){

S.user=q.data.session.user;

await cloudProfile();

render();

}

}catch(_){}

return;

}


try{

if(!sb){

S.screen='start';

render();

return;

}

let q=await sb.auth.getSession();

if(q.data.session){

S.user=q.data.session.user;

if(await cloudProfile()){

S.screen='dash';

render();

return;

}

}

}catch(_){}

S.screen='start';

render();

}

else if(S.screen==='dash')dash();

else if(S.screen==='in')income();

else if(S.screen==='out')expense();

else if(S.screen==='hin')history('pemasukan');

else if(S.screen==='hout')history('pengeluaran');

else if(S.screen==='hdetail')historyDetail();

else if(S.screen==='accounts')accounts();

else if(S.screen==='edit')edit();

else
A.innerHTML=
'<main class="page"><div class="card empty">Memuat...</div></main>';

}

/* =========================================================
   LOKASI
========================================================= */

function locate(){

let z=document.getElementById('ls');

if(!navigator.geolocation){

z.textContent=
'Browser tidak mendukung lokasi.';

return;

}

z.textContent=
'Meminta izin lokasi...';

navigator.geolocation.getCurrentPosition(

p=>{

S.loc={
lat:p.coords.latitude,
lng:p.coords.longitude
};

z.textContent=
'Lokasi berhasil dibagikan.';

},

()=>{

z.textContent=
'Lokasi belum berhasil dibagikan. Izinkan lokasi pada browser lalu coba lagi.';

},

{
enableHighAccuracy:true,
timeout:15000,
maximumAge:0
}

);

}


/* =========================================================
   SIMPAN AKUN
========================================================= */

async function finish(){

let n=rn.value.trim();

let u=ru.value.trim();

let t=rt.value.trim();

let a=ra.value.trim();

if(!n||!u||!t||!a){

return alert(
'Lengkapi semua data pendaftaran.'
);

}

let p={

id:'local-'+crypto.randomUUID(),

nama_kurir:n,

nama_usaha:u,

nomor_whatsapp:t,

alamat_lengkap:a,

latitude:S.loc.lat,

longitude:S.loc.lng,

jenis_penghasilan:S.reg.cat,

jenis_usaha:S.reg.biz,

saldo_awal:0,

saldo:0

};


/*
Jika sedang mengubah jenis usaha akun
yang sudah ada.
*/

if(S.changing){

let oldTx=S.tx;

let oldQuick=S.quick;

let oldSaldo=bal();

p.id=S.p.id;

p.saldo_awal=
oldSaldo-
oldTx.reduce(
(z,x)=>
z+
(x.jenis==='pemasukan'
?+x.nominal
:-+x.nominal),
0
);

S.accounts[S.current]={
p,
tx:oldTx,
quick:oldQuick
};

loadCurrent(S.current);

localSave();

await saveProfile();

}


/*
Jika ini akun pertama.
*/

else if(!S.adding){

let user=await auth();

p.id=user?.id||p.id;

S.user=user||S.user;

S.accounts=[
{
p,
tx:[],
quick:[]
}
];

loadCurrent(0);

localSave();

if(user)await saveProfile();

}


/*
Jika ini akun kedua, ketiga,
keempat dan seterusnya.
*/

else{

S.accounts.push({

p,

tx:[],

quick:[]

});

loadCurrent(
S.accounts.length-1
);

localSave();

}

S.adding=false;

S.changing=false;

S.screen='dash';

render();

}

function history(type){

let arr=S.tx.filter(
t=>t.jenis===type

arr.forEach(t=>{

let k=d.toLocaleDateString(
'id-ID',
{
year:'numeric',
month:'2-digit',
day:'2-digit'
}
);

});


let rows=
Object.entries(groups)
.sort(
(a,b)=>b[0].localeCompare(a[0])
)
.map(
([k,v])=>{

let total=v.reduce(
(n,t)=>n+Number(t.nominal),
0
);

let label=
new Date(
v[0].created_at
).toLocaleDateString(
'id-ID',
{
day:'2-digit',
month:'long',
year:'numeric'
}
);

return `

<button
class="option"
style="
margin-bottom:5px;
display:flex;
justify-content:space-between;
align-items:center
"
onclick="openHistoryDate('${type}','${k}')"

${label}
</span>

${rup(total)} ›
</b>

`;

}
).join('');

/* =========================================================
   HAPUS TRANSAKSI
========================================================= */

async function delTx(id){

let t=S.tx.find(
x=>String(x.id)===String(id)
);

if(
!t||
!confirm(
'Hapus transaksi ini? Saldo akan disesuaikan.'
)
)return;


if(
S.user&&
!String(t.id).startsWith('local-')
){

let q=
await sb
.from('kurir_transactions')
.delete()
.eq('id',t.id)
.eq('kurir_id',S.user.id);

if(q.error){

return alert(
'Transaksi belum dapat dihapus dari database.'
);

}

}


S.tx=S.tx.filter(
x=>String(x.id)!==String(id)
);

S.p.saldo=bal();

localSave();

await saveProfile();

render();

}

/* =========================================================

========================================================= */

async function saveEdit(){

let n=en.value.trim();

let u=eu.value.trim();

let t=et.value.trim();

let a=ea.value.trim();

let ns=Number(esaldo.value);


if(
!n||
!u||
!t||
!a||
Number.isNaN(ns)||
ns<0
){

return alert(
'Semua data harus diisi dengan benar.'
);

}


let net=S.tx.reduce(

(z,x)=>
z+
(
x.jenis==='pemasukan'
?+x.nominal
:-+x.nominal
),

0

);


Object.assign(
S.p,
{
nama_kurir:n,
nama_usaha:u,
nomor_whatsapp:t,
alamat_lengkap:a,
saldo_awal:ns-net,
saldo:ns
}
);


localSave();

await saveProfile();

alert(
'Perubahan berhasil disimpan.'
);

S.screen='dash';

render();

}
